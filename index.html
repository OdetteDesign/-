        }

            background-image:

        }

            padding: 2rem;
            border-radius: 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            max-width: 480px;
            width: 90%;
            text-align: center;
            margin: 20px 0;

        .question { font-size: 1.2rem; margin-bottom: 2rem; font-weight: bold; color: white; line-height: 1.6; min-height: 3.5em; }
        
        .options { display: flex; flex-direction: column; gap: 0.8rem; }
        button {
            padding: 1.1rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            color: var(--text-light);
            text-align: left;
        }
        button:hover { background-color: var(--primary-color); color: #0a192f; font-weight: bold; }

        #result { display: none; animation: fadeIn 1.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .bodhisattva-img {
            width: 160px; height: 160px;
            border-radius: 50%;
            border: 4px solid var(--accent-gold);
            margin: 1rem auto;
            object-fit: cover;
        }

        .dharma-words { 
            font-style: italic; background: rgba(255,255,255,0.07); 
            padding: 1.2rem; border-radius: 18px; margin: 1rem 0;
            border-left: 6px solid var(--accent-gold); font-size: 0.95rem; text-align: left;
            line-height: 1.7;
        }
        
        .product-rec { 
            background: rgba(143, 185, 53, 0.1);
            padding: 1rem;
            border-radius: 15px;
            color: var(--primary-color);
            border: 1px dashed var(--primary-color);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .btn-group { display: flex; flex-direction: column; gap: 0.8rem; }
        
        .action-link {
            display: block;
            background-color: var(--accent-gold);
            color: #0a192f;
            text-decoration: none;
            padding: 0.9rem;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1rem;

            color: white;

            padding: 0.9rem;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1rem;

</head>
