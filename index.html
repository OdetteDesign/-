<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心田漫遊：探索你的內在守護光芒</title>
    <style>
        :root {
            --primary-color: #6b8e23; /* 橄欖綠，象徵有機與生命 */
            --bg-color: #fdfaf5; /* 米白色，象徵純淨 */
            --text-color: #4a4a4a;
            --accent-color: #d4a373; /* 暖木色 */
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        #quiz-container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        h1 { color: var(--primary-color); font-size: 1.5rem; margin-bottom: 1.5rem; }
        .question { font-size: 1.1rem; margin-bottom: 2rem; font-weight: bold; }
        
        .options { display: flex; flex-direction: column; gap: 1rem; }
        button {
            padding: 1rem;
            border: 1px solid #eee;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            color: var(--text-color);
        }
        button:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        #result { display: none; }
        .bodhisattva-name { color: var(--accent-color); font-size: 1.8rem; margin: 1rem 0; font-weight: bold; }
        .dharma-words { 
            font-style: italic; 
            background: #f9f9f9; 
            padding: 1.5rem; 
            border-radius: 10px; 
            margin: 1.5rem 0;
            border-left: 4px solid var(--accent-color);
        }
        .product-rec { font-weight: bold; color: var(--primary-color); margin-top: 1rem; }
        .restart-btn { margin-top: 2rem; background: var(--text-color); color: white; border: none; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="quiz-start">
        <h1>🌱 心田漫遊</h1>
        <p>在這片有機土地上，<br>探索你內在的菩薩守護光芒。</p>
        <button onclick="startQuiz()" style="background: var(--primary-color); color: white; width: 100%;">開始測驗</button>
    </div>

    <div id="quiz-content" style="display:none;">
        <div id="progress" style="font-size: 0.8rem; color: #999; margin-bottom: 1rem;"></div>
        <div class="question" id="question-text"></div>
        <div class="options" id="options-container"></div>
    </div>

    <div id="result">
        <p>測驗完成！你的內在特質契合：</p>
        <div class="bodhisattva-name" id="b-name"></div>
        <div class="dharma-words" id="b-dharma"></div>
        <p>✨ 推薦您的愛心行動：</p>
        <div class="product-rec" id="b-product"></div>
        <button class="restart-btn" onclick="location.reload()">重新測驗</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "在門市看到庇護工場的小夥伴正專注包裝商品，你會？",
            options: [
                { text: "給予微笑並耐心等待", type: "A" },
                { text: "思考包裝流程如何精進", type: "B" },
                { text: "多買幾份與朋友分享", type: "C" },
                { text: "靜靜觀察並體會其汗水", type: "D" }
            ]
        },
        {
            q: "看到有機農耕留下許多蟲咬痕跡，你的第一想法是？",
            options: [
                { text: "感受到萬物共生的慈悲", type: "A" },
                { text: "聯想到生態平衡的邏輯", type: "B" },
                { text: "讚嘆農友不捨初心的願力", type: "C" },
                { text: "思考如何落實購買支持", type: "D" }
            ]
        },
        {
            q: "當你遇到壓力需要療癒時，你通常會？",
            options: [
                { text: "找朋友訴說、尋求情感連結", type: "A" },
                { text: "閱讀經典或靜坐尋找答案", type: "B" },
                { text: "投入志工服務或體力勞動", type: "C" },
                { text: "制定並執行新的健康飲食計畫", type: "D" }
            ]
        }
    ];

    const results = {
        A: {
            name: "觀世音菩薩｜慈悲心",
            dharma: "「慈悲不是一種能力，而是一種選擇。當我們選擇以柔軟的心看待萬物，每一份購買都是一次溫暖的擁抱。」",
            product: "庇護工場手工烘焙餅乾、暖心草本茶"
        },
        B: {
            name: "文殊菩薩｜智慧心",
            dharma: "「智慧是看清事物的本質。選擇純淨的食物，是看見了生命與環境的共生。願你回歸最簡單的本心。」",
            product: "純淨冷壓植物油、有機五穀粉"
        },
        C: {
            name: "地藏菩薩｜大願心",
            dharma: "「腳下的每一寸土地，都承載著願力。你的每一份堅持，都在成就他人的自立之路。」",
            product: "友善耕作大米、耐磨手工帆布袋"
        },
        D: {
            name: "普賢菩薩｜實踐心",
            dharma: "「萬億願景，皆始於足下的行動。修行不在遠方，而在日常的穿衣吃飯間，親手淨化世界。」",
            product: "天然環保洗劑、友善環境農產品"
        }
    };

    let currentStep = 0;
    let scores = { A: 0, B: 0, C: 0, D: 0 };

    function startQuiz() {
        document.getElementById('quiz-start').style.display = 'none';
        document.getElementById('quiz-content').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentStep];
        document.getElementById('progress').innerText = `問題 ${currentStep + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(opt.type);
            container.appendChild(btn);
        });
    }

    function selectOption(type) {
        scores[type]++;
        currentStep++;
        if (currentStep < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-content').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        
        // 找出得分最高的類型
        const winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        const res = results[winner];
        
        document.getElementById('b-name').innerText = res.name;
        document.getElementById('b-dharma').innerText = res.dharma;
        document.getElementById('b-product').innerText = res.product;
    }
</script>

</body>
</html>
