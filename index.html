<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索你的內在守護光芒</title>
    <style>
        :root {
            --primary-color: #6b8e23;
            --bg-color: #fdfaf5;
            --text-color: #4a4a4a;
            --accent-color: #d4a373;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #quiz-container {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 90%;
            text-align: center;
            overflow: hidden;
        }

        .hero-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            background: #eee;
        }

        h1 { color: var(--primary-color); font-size: 1.6rem; margin-top: 0; }
        .question { font-size: 1.15rem; margin-bottom: 1.5rem; font-weight: bold; min-height: 3em; }
        
        .options { display: flex; flex-direction: column; gap: 0.8rem; }
        button {
            padding: 0.9rem;
            border: 1px solid #eee;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            color: var(--text-color);
        }
        button:active { transform: scale(0.98); }
        button:hover { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        #result { display: none; animation: fadeIn 0.8s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .bodhisattva-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid var(--bg-color);
            margin: 1rem auto;
            object-fit: cover;
        }

        .bodhisattva-name { color: var(--accent-color); font-size: 1.5rem; margin: 0.5rem 0; font-weight: bold; }
        .dharma-words { 
            font-style: italic; 
            background: #fdfaf5; 
            padding: 1.2rem; 
            border-radius: 12px; 
            margin: 1rem 0;
            border-left: 5px solid var(--accent-color);
            font-size: 0.95rem;
            text-align: left;
        }
        .product-rec { 
            background: #f1f8e9;
            padding: 1rem;
            border-radius: 12px;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 0.9rem;
        }
        .restart-btn { margin-top: 1.5rem; background: #999; color: white; border: none; width: 100%; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="quiz-start">
        <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&q=80&w=500" class="hero-img" alt="有機心田">
        <h1>🌱 心田漫遊</h1>
        <p>每一份善念，都是一顆種子。<br>探索你內在的菩薩守護光芒。</p>
        <button onclick="startQuiz()" style="background: var(--primary-color); color: white; width: 100%;">開始探索</button>
    </div>

    <div id="quiz-content" style="display:none;">
        <div id="progress" style="font-size: 0.8rem; color: #999; margin-bottom: 0.5rem;"></div>
        <div class="question" id="question-text"></div>
        <div class="options" id="options-container"></div>
    </div>

    <div id="result">
        <img id="res-img" src="" class="bodhisattva-img">
        <div class="bodhisattva-name" id="b-name"></div>
        <div class="dharma-words" id="b-dharma"></div>
        <p style="font-size: 0.85rem; color: #888;">✨ 契合您的菩薩行行動：</p>
        <div class="product-rec" id="b-product"></div>
        <button class="restart-btn" onclick="location.reload()">重新測驗</button>
    </div>
</div>

<script>
    // 這裡請替換為您生成的圖片網址
    const images = {
        A: "https://images.unsplash.com/photo-1609154767012-331529e7d73b?q=80&w=200&h=200&fit=crop", // 觀音意象：蓮花
        B: "https://images.unsplash.com/photo-1502082553245-f0bc7a285147?q=80&w=200&h=200&fit=crop", // 文殊意象：智慧森林
        C: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=200&h=200&fit=crop", // 地藏意象：厚實大地
        D: "https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=200&h=200&fit=crop"  // 普賢意象：茁壯幼苗
    };

    const questions = [
        {
            q: "看到庇護工場的小夥伴專注包裝時，你會？",
            options: [
                { text: "給予微笑並耐心等待", type: "A" },
                { text: "思考流程如何精進", type: "B" },
                { text: "多買幾份分享朋友", type: "C" },
                { text: "靜心體會其汗水", type: "D" }
            ]
        },
        {
            q: "有機農作物上的蟲咬痕跡，讓你聯想到？",
            options: [
                { text: "萬物共生的慈悲", type: "A" },
                { text: "生態平衡的智慧", type: "B" },
                { text: "農友堅定的願力", type: "C" },
                { text: "親手落實的支持", type: "D" }
            ]
        },
        {
            q: "壓力大時，你傾向如何找回平靜？",
            options: [
                { text: "找尋情感的溫暖連結", type: "A" },
                { text: "靜坐閱讀啟發智慧", type: "B" },
                { text: "投入服務忘卻自我", type: "C" },
                { text: "執行健康的生活計畫", type: "D" }
            ]
        }
    ];

    const results = {
        A: { name: "觀世音菩薩｜慈悲心", dharma: "「慈悲不是一種能力，而是一種選擇。以柔軟心看待萬物，每一份購買都是溫暖的擁抱。」", product: "支持：手工烘焙餅乾、暖心草本茶" },
        B: { name: "文殊菩薩｜智慧心", dharma: "「智慧是看清事物的本質。選擇純淨的食物，是看見了生命與環境的共生。願你回歸清明本心。」", product: "支持：純淨冷壓植物油、有機五穀粉" },
        C: { name: "地藏菩薩｜大願心", dharma: "「腳下的每一寸土地，都承載著願力。你的每一份堅持，都在成就他人的自立之路。」", product: "支持：友善耕作大米、手工帆布袋" },
        D: { name: "普賢菩薩｜實踐心", dharma: "「萬億願景，皆始於足下的行動。修行不在遠方，而在日常的穿衣吃飯間，親手淨化世界。」", product: "支持：環保洗劑、友善環境農產品" }
    };

    let currentStep = 0;
    let scores = { A: 0, B: 0, C: 0, D: 0 };

    function startQuiz() {
        document.getElementById('quiz-start').style.display = 'none';
        document.getElementById('quiz-content').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentStep];
        document.getElementById('progress').innerText = `Step ${currentStep + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(opt.type);
            container.appendChild(btn);
        });
    }

    function selectOption(type) {
        scores[type]++;
        currentStep++;
        currentStep < questions.length ? showQuestion() : showResult();
    }

    function showResult() {
        document.getElementById('quiz-content').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        const winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        const res = results[winner];
        document.getElementById('res-img').src = images[winner];
        document.getElementById('b-name').innerText = res.name;
        document.getElementById('b-dharma').innerText = res.dharma;
        document.getElementById('b-product').innerText = res.product;
    }
</script>
</body>
</html>
